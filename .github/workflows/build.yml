## Build tcc-g15 (web-enabled fork) as a Windows installer + portable exe.
##
## Triggers:
##   - push a tag like v1.6.5-web1  -> builds and attaches to a Release
##   - manual run from the Actions tab (Run workflow button)
##
## Outputs:
##   - tcc-g15-installer-<version>.exe  (Inno Setup installer, per-machine)
##   - tcc-g15.exe                      (portable single file)
##
## The installer is a two-stage build:
##   1. PyInstaller ONEDIR (no -F) -> dist/tcc-g15/  (installer-inno-config.iss
##      packs every file from this directory)
##   2. Inno Setup ISCC compiles installer-inno-config.iss

name: Build Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      # ---- Stage 1a: ONEDIR build (source for the installer) ----
      # Uses tcc-g15.spec, which prunes Qt binaries the app never uses
      # (opengl32sw, QML/Quick, Pdf, translations, ...). That cuts the
      # payload from ~121 MB to ~75 MB, and the installer from ~37 MB
      # to ~23 MB. The spec also produces dist/tcc-g15/, which
      # installer-inno-config.iss packs.
      - name: Build ONEDIR (for installer)
        run: |
          python -m PyInstaller --noconfirm --workpath build --distpath dist tcc-g15.spec

      - name: Verify ONEDIR output
        run: |
          if (!(Test-Path "dist/tcc-g15/tcc-g15.exe")) {
            Write-Error "dist/tcc-g15/tcc-g15.exe was not produced"
            Get-ChildItem dist -Recurse -Depth 2 | Select-Object FullName
            exit 1
          }
          # Fail loudly if pruning removed something the app needs at runtime.
          $required = @(
            "dist/tcc-g15/_internal/PySide6/Qt6Core.dll",
            "dist/tcc-g15/_internal/PySide6/Qt6Gui.dll",
            "dist/tcc-g15/_internal/PySide6/Qt6Widgets.dll",
            "dist/tcc-g15/_internal/PySide6/plugins/platforms/qwindows.dll",
            "dist/tcc-g15/_internal/Web/templates/index.html",
            "dist/tcc-g15/_internal/icons/gaugeIcon.ico"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Error "Pruning removed required files:`n$($missing -join "`n")"
            exit 1
          }
          $size = (Get-ChildItem dist/tcc-g15 -Recurse -File |
                   Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("ONEDIR payload: {0:N2} MB" -f $size)
          # A healthy ONEDIR is ~75 MB. Guard against a silently partial tree
          # (a truncated payload still passes the file-existence checks above
          # but produces an installer that fails to install).
          if ($size -lt 55) {
            Write-Error ("ONEDIR payload is only {0:N2} MB, expected ~75 MB. Aborting." -f $size)
            exit 1
          }
          Get-ChildItem dist/tcc-g15 | Select-Object Name, Length

      # ---- Stage 2: compile the installer ----
      - name: Compile installer (Inno Setup)
        run: |
          # ISCC may live in a machine-wide or per-user location depending on
          # how Inno Setup was installed; probe the usual spots and fall back
          # to a filesystem search rather than assuming one path.
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = (Get-ChildItem -Path "C:\" -Filter "ISCC.exe" -Recurse `
                     -ErrorAction SilentlyContinue -Force |
                     Select-Object -First 1).FullName
          }
          if (-not $iscc) { Write-Error "ISCC.exe not found"; exit 1 }
          Write-Host "Using $iscc"
          # Remove any stale installer first, so a failed compile cannot leave
          # a previous (possibly broken) file behind to be published.
          Remove-Item dist\tcc-g15-installer-*.exe -Force -ErrorAction SilentlyContinue
          & $iscc "installer-inno-config.iss"
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC failed: $LASTEXITCODE"; exit 1 }

          # Sanity-check the installer: it must exist and be a plausible size
          # (~23 MB). A truncated setup exe still looks like a valid file but
          # aborts with exit code 1 when run, which shipped a broken release
          # once already.
          $setup = Get-ChildItem dist\tcc-g15-installer-*.exe -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          if (-not $setup) { Write-Error "Installer was not produced"; exit 1 }
          $mb = $setup.Length / 1MB
          Write-Host ("Installer: {0} ({1:N2} MB)" -f $setup.Name, $mb)
          if ($mb -lt 15) {
            Write-Error ("Installer is only {0:N2} MB, expected ~23 MB. It is truncated." -f $mb)
            exit 1
          }

      # Prove the installer actually works before publishing it. This catches
      # the "valid-looking but broken" case that size checks alone can miss.
      - name: Smoke-test the installer
        run: |
          $setup = (Get-ChildItem dist\tcc-g15-installer-*.exe | Select-Object -First 1).FullName
          $target = Join-Path $env:RUNNER_TEMP "install-smoke"
          $proc = Start-Process -FilePath $setup `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=`"$target`"" `
            -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            Write-Error "Installer exited with $($proc.ExitCode) — it is not usable"
            exit 1
          }
          $exe = Join-Path $target "tcc-g15.exe"
          if (-not (Test-Path $exe)) { Write-Error "Installed exe missing at $exe"; exit 1 }
          $count = (Get-ChildItem $target -Recurse -File).Count
          $mb = (Get-ChildItem $target -Recurse -File |
                 Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("Installed OK: {0} files, {1:N2} MB" -f $count, $mb)
          if ($mb -lt 55) {
            Write-Error ("Installed payload is only {0:N2} MB, expected ~80 MB" -f $mb)
            exit 1
          }
          Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue

      # ---- Stage 1b: portable single-file build ----
      # Same Qt pruning, collapsed into one exe. Built with its own spec so
      # it does not disturb dist/tcc-g15/ that the installer just consumed.
      - name: Build portable onefile
        run: |
          python -m PyInstaller --noconfirm `
            --workpath build-portable `
            --distpath dist-portable `
            tcc-g15-portable.spec

      - name: Collect artifacts
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item dist\tcc-g15-installer-*.exe out\ -ErrorAction Stop
          Copy-Item dist-portable\tcc-g15-portable.exe out\tcc-g15.exe -ErrorAction Stop
          Write-Host "Final artifacts:"
          Get-ChildItem out | ForEach-Object {
            "{0}  {1:N2} MB" -f $_.Name, ($_.Length / 1MB)
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tcc-g15-windows
          path: out/*
          if-no-files-found: error

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
